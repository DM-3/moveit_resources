# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    panda1_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda1_hand_controller:
      type: position_controllers/GripperActionController

    panda2_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda2_hand_controller:
      type: position_controllers/GripperActionController

    panda3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda3_hand_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


panda1_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - panda1_joint1
      - panda1_joint2
      - panda1_joint3
      - panda1_joint4
      - panda1_joint5
      - panda1_joint6
      - panda1_joint7
    allow_nonzero_velocity_at_trajectory_end: true

panda1_hand_controller:
  ros__parameters:
    joint: panda1_finger_joint1


panda2_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - panda2_joint1
      - panda2_joint2
      - panda2_joint3
      - panda2_joint4
      - panda2_joint5
      - panda2_joint6
      - panda2_joint7
    allow_nonzero_velocity_at_trajectory_end: true

panda2_hand_controller:
  ros__parameters:
    joint: panda2_finger_joint1


panda3_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - panda3_joint1
      - panda3_joint2
      - panda3_joint3
      - panda3_joint4
      - panda3_joint5
      - panda3_joint6
      - panda3_joint7
    allow_nonzero_velocity_at_trajectory_end: true

panda3_hand_controller:
  ros__parameters:
    joint: panda3_finger_joint1
